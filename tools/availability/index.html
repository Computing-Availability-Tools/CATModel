<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传统可用度计算 - CATModel</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="../../index.html" class="back-link">&larr; 返回</a>
            <h1>传统可用度计算</h1>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>输入参数</h2>
            <p style="font-size:13px;color:#666;margin-bottom:12px">公式: A = MTBF / (MTBF + MTTR)</p>
            <div class="form-row">
                <div class="form-group">
                    <label for="mtbf">MTBF (平均故障间隔)</label>
                    <input type="number" id="mtbf" min="0" step="any" placeholder="单位: 小时">
                    <div class="hint">必须 > 0</div>
                </div>
                <div class="form-group">
                    <label for="mttr">MTTR (平均修复时间)</label>
                    <input type="number" id="mttr" min="0" step="any" placeholder="单位: 小时">
                    <div class="hint">必须 >= 0</div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="calculate()">计算</button>
                <button class="btn btn-secondary" onclick="resetForm()">重置</button>
            </div>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="card" id="result-card" style="display:none">
            <h2>计算结果</h2>
            <div class="result-grid">
                <div class="result-item">
                    <div class="label">可用度</div>
                    <div class="value highlight" id="result-availability">-</div>
                </div>
                <div class="result-item">
                    <div class="label">可用度等级</div>
                    <div class="value" id="result-level" style="font-size:16px">-</div>
                </div>
                <div class="result-item">
                    <div class="label">年停机时间</div>
                    <div class="value" id="result-downtime">-</div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="App.saveCurrentRecord('availability')">保存记录</button>
            </div>
        </div>

        <div class="card">
            <h2>历史记录</h2>
            <div class="btn-group" style="margin-top:0; margin-bottom:12px">
                <button class="btn btn-sm btn-secondary" onclick="App.handleExport('availability')">导出</button>
                <button class="btn btn-sm btn-secondary" onclick="App.handleImport('availability')">导入</button>
                <button class="btn btn-sm btn-danger" onclick="App.handleClear('availability')">清空</button>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <script src="../../js/calculators.js"></script>
    <script src="../../js/converters.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        const TOOL_ID = 'availability';
        let lastInputs = null;
        let lastOutputs = null;

        function calculate() {
            const mtbf = document.getElementById('mtbf').value;
            const mttr = document.getElementById('mttr').value;
            const errorEl = document.getElementById('error-msg');

            errorEl.classList.remove('show');

            const result = Calculators.calcAvailability(mtbf, mttr);
            if (!result) {
                errorEl.textContent = '请输入有效参数 (MTBF > 0, MTTR >= 0)';
                errorEl.classList.add('show');
                document.getElementById('result-card').style.display = 'none';
                return;
            }

            lastInputs = { MTBF: parseFloat(mtbf), MTTR: parseFloat(mttr) };
            lastOutputs = result;

            document.getElementById('result-availability').textContent = result.availabilityPct;
            document.getElementById('result-level').textContent = result.level;
            document.getElementById('result-downtime').textContent = Converters.formatHours(result.downtimePerYear);
            document.getElementById('result-card').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('mtbf').value = '';
            document.getElementById('mttr').value = '';
            document.getElementById('result-card').style.display = 'none';
            document.getElementById('error-msg').classList.remove('show');
            lastInputs = null;
            lastOutputs = null;
        }

        document.addEventListener('record-save-request', (e) => {
            if (e.detail.toolId !== TOOL_ID || !lastInputs) return;
            const name = prompt('为这次计算命名:', `MTBF=${lastInputs.MTBF}h MTTR=${lastInputs.MTTR}h`);
            if (name === null) return;
            Storage.saveRecord(TOOL_ID, name, lastInputs, lastOutputs);
            App.renderHistoryList(TOOL_ID);
            alert('记录已保存');
        });

        document.addEventListener('record-load', (e) => {
            if (e.detail.toolId !== TOOL_ID) return;
            const r = e.detail.record;
            document.getElementById('mtbf').value = r.inputs.MTBF;
            document.getElementById('mttr').value = r.inputs.MTTR;
            calculate();
        });

        document.querySelectorAll('#mtbf, #mttr').forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') calculate();
            });
        });

        App.renderHistoryList(TOOL_ID);
    </script>
</body>
</html>
